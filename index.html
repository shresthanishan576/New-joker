<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Joker: High Stakes Edition</title>
    <meta name="description" content="A premium animated Joker card game — hold the Joker last and win the pot!">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div id="root">
    <div id="vignette"></div>

    <div id="title">🃏 JOKER — HIGH STAKES</div>

    <div id="economy-bar">
        <div class="eco-item" id="eco-bank">BANK: <span id="bank-val">1000</span> <span class="eco-icon">🪙</span></div>
        <div class="eco-item" id="eco-streak">STREAK: <span id="streak-val">0</span> <span class="eco-icon">🔥</span></div>
    </div>

    <div id="table">
        <!-- TOP: CPU 2 -->
        <div class="seat" id="seat-top">
            <div class="plabel" id="lbl-1">
                <span class="pname">CPU 2</span>
                <span class="thinking-dots" id="dots-1"></span>
                <span class="cnt" id="lcnt-1"></span>
            </div>
            <div class="hand" id="hand-1"></div>
        </div>

        <!-- LEFT: CPU 3 -->
        <div class="seat" id="seat-left">
            <div class="plabel" id="lbl-3">
                <span class="pname">CPU 3</span>
                <span class="thinking-dots" id="dots-3"></span>
                <span class="cnt" id="lcnt-3"></span>
            </div>
            <div class="hand" id="hand-3"></div>
        </div>

        <!-- CENTER -->
        <div id="center">
            <div id="deckPile"></div>
            <div id="status">Press Deal to Begin</div>
            <div id="action-btns">
                <button id="btnPeek" class="action-btn peek-btn" title="Peek at one CPU card (costs 50🪙)">👁️ PEEK <small>50🪙</small></button>
                <button id="btnSound" class="action-btn sound-btn" title="Toggle sound">🔊</button>
            </div>
        </div>

        <!-- RIGHT: CPU 4 -->
        <div class="seat" id="seat-right">
            <div class="plabel" id="lbl-2">
                <span class="pname">CPU 4</span>
                <span class="thinking-dots" id="dots-2"></span>
                <span class="cnt" id="lcnt-2"></span>
            </div>
            <div class="hand" id="hand-2"></div>
        </div>

        <!-- BOTTOM: You -->
        <div class="seat" id="seat-bottom">
            <div class="plabel" id="lbl-0">
                <span class="pname">YOU</span>
                <span class="thinking-dots" id="dots-0"></span>
                <span class="cnt" id="lcnt-0"></span>
            </div>
            <div class="hand" id="hand-0"></div>
        </div>
    </div>

    <div id="hint"></div>
    <div id="toast"></div>
</div>

<!-- Overlay / Modal -->
<div id="overlay" class="show">
    <div id="overlay-inner">
        <h2 id="ovTitle">🃏 Joker</h2>
        <p id="ovMsg">Be the <strong>last one</strong> holding the <strong class="joker-text">Joker</strong> to lose — or avoid it and win!<br>
        <small>Each game costs <strong>100 🪙</strong>. Win to claim the pot!</small></p>

        <div id="bet-section">
            <div id="bet-label">SELECT YOUR BET</div>
            <div id="bet-btns">
                <button class="bet-btn active" data-bet="100">100 🪙</button>
                <button class="bet-btn" data-bet="200">200 🪙</button>
                <button class="bet-btn" data-bet="500">500 🪙</button>
            </div>
        </div>

        <button class="ovBtn" id="btnStart">✨ Deal Cards</button>
    </div>
</div>

<!-- Card animation staging area -->
<div id="fly-stage"></div>

<script src="js/audio.js"></script>
<script src="js/animator.js"></script>
<script src="js/game.js"></script>
</body>
</html>
